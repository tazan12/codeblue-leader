name: 웹 버전 배포 (GitHub Pages)
on:
  push:
    branches: [main]
    paths: ['src/**', 'tools/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 빌드
        run: python tools/build.py
      - name: gh-pages 브랜치에 게시
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist/web
          publish_branch: gh-pages
          force_orphan: true
          commit_message: 'web: ${{ github.sha }}'
